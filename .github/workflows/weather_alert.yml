name: Weather Alert (Wonju Dangu-dong Rain/Snow)

# GitHub 자체 cron(schedule)은 삭제했습니다.
# 평일 17:30 KST 실행은 외부 스케줄러(cron-job.org)가 workflow_dispatch(mode=auto)로 호출합니다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: false
        default: "check"
        type: choice
        options:
          - check   # 수동: 비/눈 예보가 있을 때만 알림
          - test    # 수동: 예보가 없어도 '이상 없음' 테스트 알림 발송
          - auto    # 외부 스케줄러용 (평일 17:30 자동 실행)

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests holidays

      - name: 날씨 확인 및 텔레그램 알림
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_MODE: ${{ github.event.inputs.mode }}
        run: python weather_alert.py
